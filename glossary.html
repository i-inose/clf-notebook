<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CLF サービス用語集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* レイアウト: カテゴリのチップと検索を上に固定し、その下にサービスのカードを並べる。カードは一言説明だけを見せ、開くと詳しい説明が出る */
:root {
  --paper: #f6f7f9;
  --sheet: #ffffff;
  --grid: #e3e8ef;
  --ink: #1d2a3a;
  --ink-soft: #5a6778;
  --line: #d5dce6;
  --accent: #2456a6;
  --accent-soft: #e6eefb;
  --red: #c8322b;
  --red-soft: #fbe9e7;
  --amber: #a86400;
  --amber-soft: #fdf1dc;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #12161c; --sheet: #1a2029; --grid: #1f2630; --ink: #e4e9f0; --ink-soft: #9aa6b5;
    --line: #2e3744; --accent: #8db4f5; --accent-soft: #1d2a40; --red: #ff8a80; --red-soft: #3a1f1e;
    --amber: #f2b85c; --amber-soft: #3a2c15; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 14px;
}
header { display: grid; gap: 4px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 900; font-size: 24px; line-height: 1.3; margin: 0; }
.lead { margin: 0; color: var(--ink-soft); font-size: 14px; }
nav { display: flex; flex-wrap: wrap; gap: 12px; font-size: 14px; }
nav a { color: var(--accent); }

.controls {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); padding-block: 8px; display: grid; gap: 8px;
}
#search {
  width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--sheet); color: var(--ink);
}
#search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chips button {
  all: unset; cursor: pointer; white-space: nowrap; padding: 5px 12px; border-radius: 999px; font-size: 13px;
  border: 1px solid var(--line); background: var(--sheet); color: var(--ink-soft);
}
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.chips button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-size: 13px; color: var(--ink-soft); }

.list { display: grid; gap: 10px; }
.cat-title { font-family: var(--font-display); font-size: 16px; margin: 10px 0 0; }
details.card { background: var(--sheet); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
details.card > summary {
  cursor: pointer; list-style: none; padding: 12px 14px; display: grid; gap: 2px;
}
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 12px; }
.name { font-weight: 700; font-size: 16px; }
.summary { color: var(--ink-soft); font-size: 14px; }
details.card[open] > summary { border-bottom: 1px dashed var(--line); }
.body { padding: 12px 14px 14px; display: grid; gap: 10px; }
.body p { margin: 0; }
.body h3 { font-size: 12px; letter-spacing: .04em; color: var(--ink-soft); margin: 0 0 2px; font-weight: 700; }
.body ul { margin: 0; padding-left: 1.2em; }
.kw { display: flex; flex-wrap: wrap; gap: 6px; }
.kw span { font-size: 13px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.vs { display: grid; gap: 6px; }
.vs div { padding: 8px 10px; border-left: 3px solid var(--red); background: var(--red-soft); border-radius: 0 8px 8px 0; font-size: 14px; }
.vs b { display: block; }
.note { padding: 8px 10px; border-left: 3px solid var(--amber); background: var(--amber-soft); border-radius: 0 8px 8px 0; font-size: 14px; }
.src a { color: var(--accent); font-size: 13px; word-break: break-all; }
.empty { text-align: center; color: var(--ink-soft); padding: 24px 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">AWS CERTIFIED CLOUD PRACTITIONER · CLF-C02</span>
    <h1>CLF サービス用語集</h1>
    <p class="lead">試験ガイドの対象サービスを、カテゴリ別にまとめています。カードを開くと、機能・使う場面・試験のキーワード・取り違えやすい相手との違いが出ます。</p>
    <nav>
      <a href="quiz.html">クイズ</a>
      <a href="knowledge.html">見分け方ノート</a>
      <a href="./">間違いノート</a>
    </nav>
  </header>
  <div class="controls">
    <input id="search" type="search" placeholder="サービス名やキーワードで探す（例: ログ、暗号化、S3）" aria-label="検索">
    <div class="chips" id="chips" role="group" aria-label="カテゴリ"></div>
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"><p class="empty">読み込んでいます</p></div>
</div>

<script>
let entries = [];
let category = "all";
let query = "";

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

function haystack(e) {
  return [e.name, e.category, e.summary, e.description, ...(e.features || []), ...(e.useCases || []),
    ...(e.keywords || []), ...(e.confusedWith || []).map(c => c.name + " " + c.diff), e.note].join(" ").toLowerCase();
}

function card(e) {
  const body = el("div", { class: "body" }, el("p", { text: e.description }));
  const list = (title, items) => items && items.length
    ? el("div", {}, el("h3", { text: title }), el("ul", {}, ...items.map(t => el("li", { text: t })))) : null;
  body.append(...[list("主な機能・特徴", e.features), list("使う場面", e.useCases)].filter(Boolean));
  if ((e.keywords || []).length) body.append(el("div", {}, el("h3", { text: "試験で出るキーワード" }), el("div", { class: "kw" }, ...e.keywords.map(k => el("span", { text: k })))));
  if ((e.confusedWith || []).length) body.append(el("div", {}, el("h3", { text: "取り違えやすい相手との違い" }),
    el("div", { class: "vs" }, ...e.confusedWith.map(c => el("div", {}, el("b", { text: c.name }), c.diff)))));
  if (e.note) body.append(el("div", { class: "note", text: e.note }));
  if (/^https:\/\//.test(e.url || "")) body.append(el("div", { class: "src" }, el("a", { href: e.url, target: "_blank", rel: "noopener", text: "公式ドキュメント" })));
  return el("details", { class: "card" }, el("summary", {}, el("span", { class: "name", text: e.name }), el("span", { class: "summary", text: e.summary })), body);
}

function render() {
  const cats = [...new Set(entries.map(e => e.category))];
  document.getElementById("chips").replaceChildren(...[["all", "すべて"], ...cats.map(c => [c, c])].map(([v, t]) => {
    const b = el("button", { type: "button", "aria-pressed": String(category === v), text: t });
    b.addEventListener("click", () => { category = v; render(); });
    return b;
  }));
  const shown = entries.filter(e => (category === "all" || e.category === category) && (!query || haystack(e).includes(query)));
  document.getElementById("count").textContent = `${shown.length} / ${entries.length} 件`;
  const out = [];
  for (const c of cats) {
    const items = shown.filter(e => e.category === c);
    if (!items.length) continue;
    out.push(el("h2", { class: "cat-title", text: c }), ...items.map(card));
  }
  document.getElementById("list").replaceChildren(...(out.length ? out : [el("p", { class: "empty", text: "見つかりませんでした。別の言葉で探してみてください。" })]));
}

document.getElementById("search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });

fetch("glossary.json", { cache: "no-store" })
  .then(r => r.ok ? r.json() : { entries: [] })
  .then(d => { entries = d && Array.isArray(d.entries) ? d.entries : []; render(); })
  .catch(() => render());
</script>
</body>
</html>
